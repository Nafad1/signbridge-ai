{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold">Penerjemah Teks ke Isyarat</h2>
        <p class="text-muted">Ketik kata atau kalimat. Kata yang ada di kamus diisyaratkan langsung, kata lain dieja huruf demi huruf (abjad BISINDO).</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="input-group input-group-lg mb-2 shadow-sm">
                <input type="text" id="search-input" class="form-control" placeholder="Contoh: halo, terima kasih budi" aria-label="Teks">
                <button class="btn btn-cyan" type="button" id="search-btn">
                    <i class="fa-solid fa-play"></i> Terjemahkan
                </button>
            </div>
            <div class="mb-4 small text-muted">Coba:
                <button type="button" class="btn btn-sm btn-outline-secondary ms-1" data-example="halo">halo</button>
                <button type="button" class="btn btn-sm btn-outline-secondary ms-1" data-example="terima kasih">terima kasih</button>
                <button type="button" class="btn btn-sm btn-outline-secondary ms-1" data-example="halo nama saya budi">halo nama saya budi</button>
            </div>

            <div id="result-area" class="card shadow-lg border-0 rounded-4 p-4 text-center d-none">
                <div class="bg-dark rounded-3 d-flex align-items-center justify-content-center mb-3 overflow-hidden" style="height: 340px;">
                    <canvas id="stage-canvas" width="640" height="340" class="w-100 h-100"></canvas>
                    <video id="stage-video" class="d-none h-100" style="max-width:100%;" playsinline muted></video>
                </div>
                <h2 id="stage-caption" class="fw-bold text-cyan mb-3">-</h2>

                <div id="chips" class="d-flex flex-wrap justify-content-center gap-2 mb-3"></div>

                <div class="d-flex justify-content-center align-items-center gap-3">
                    <button id="play-btn" class="btn btn-cyan px-4" type="button"><i class="fa-solid fa-play me-2"></i>Putar</button>
                    <select id="speed-select" class="form-select w-auto" aria-label="Kecepatan">
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                </div>

                <div id="notice" class="alert alert-info small text-start mt-3 mb-0 d-none"></div>
            </div>

            <div id="error-area" class="alert alert-warning d-none shadow-sm" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i> <span id="error-message"></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/sign_player.js') }}"></script>
{% endblock %}

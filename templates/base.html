<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge AI - Penerjemah Bahasa Isyarat</title>
    
    <!-- Bootstrap CSS (Untuk Desain Responsif) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (Untuk Ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS Kita -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-navy sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i class="fa-solid fa-hands-asl-interpreting text-cyan me-2"></i>SignBridge <span class="text-cyan">AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('translator') }}">Penerjemah Isyarat</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('text_to_sign') }}">Penerjemah Teks</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('dictionary') }}">Kamus BISINDO</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('guide') }}">Panduan</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">Tentang</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- KONTEN UTAMA (Akan diisi oleh halaman lain) -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-navy text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-1">&copy; 2026 SignBridge AI. Proyek Perkuliahan.</p>
            <small class="text-muted">Dibuat untuk mendukung komunikasi inklusif dengan BISINDO.</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS Kita -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
